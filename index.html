<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00081c" />
    <title>Hash Driller</title>
    <meta name="description" content="A pixel-art digging game: dig down level by level and grab each level's golden # to mine it. Every level is a real botBTC block." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drill.botbtc.fun/" />
    <meta property="og:title" content="Hash Driller" />
    <meta property="og:description" content="Dig down, grab each level's golden #, grow your chain. A pixel-art digging game by botBTC." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@botbtcfun" />
  </head>
  <body>
    <main id="app">
      <section id="stage">
        <div id="loading" class="loading" role="status">
          <!-- bot -->
          <span class="bar"><span id="load-bar"></span></span>
          <p id="load-text">LOADING</p>
          <noscript><p>HASH DRILLER NEEDS JAVASCRIPT</p></noscript>
        </div>
        <div id="game"></div>
        <div id="banner" aria-live="polite"></div>
        <div id="overlay" hidden></div>
      </section>
      <aside id="hud">
        <h1>HASH<br />DRILLER</h1>
        <p id="goal" class="goal"></p>
        <dl>
          <div><dt>LEVEL</dt><dd id="level">-</dd></div>
          <div><dt>DEPTH</dt><dd id="depth">0 m</dd></div>
          <div><dt>SATS</dt><dd id="sats" class="coin">0</dd></div>
          <div><dt>LIVES</dt><dd id="lives"></dd></div>
          <div class="wide">
            <dt>POWER</dt>
            <dd><span class="bar"><span id="power"></span></span></dd>
          </div>
          <div><dt>MINED</dt><dd id="mined">0/0</dd></div>
          <div><dt>CHAIN</dt><dd id="chain">-</dd></div>
          <div><dt>FEES</dt><dd id="fees" class="fee">0</dd></div>
          <div class="opt"><dt>NEXT # PAYS</dt><dd id="next" class="coin">50,000</dd></div>
          <div class="opt"><dt>DIFF</dt><dd id="diff">1.00</dd></div>
        </dl>
        <p class="keys">← → move, or dig what's there<br />↓ dig down · ↑ dig up<br />SPACE jump onto a step<br />P pause · R restart · M sound</p>
        <button id="sound" class="sound" type="button" aria-pressed="true">SOUND ON</button>
      </aside>
      <div id="pad" class="pad">
        <div id="dpad" class="dpad">
          <span class="key up" data-dir="up"><svg viewBox="0 0 10 10"><path d="M5 2 9 8H1z" /></svg></span>
          <span class="key left" data-dir="left"><svg viewBox="0 0 10 10"><path d="M2 5 8 1v8z" /></svg></span>
          <span class="key right" data-dir="right"><svg viewBox="0 0 10 10"><path d="M8 5 2 1v8z" /></svg></span>
          <span class="key down" data-dir="down"><svg viewBox="0 0 10 10"><path d="M5 8 9 2H1z" /></svg></span>
        </div>
        <div class="actions">
          <div class="small">
            <button id="pause" class="key" type="button" aria-label="Pause">II</button>
            <button id="sound-pad" class="key" type="button" aria-label="Sound" aria-pressed="true">
              <svg viewBox="0 0 10 10"><path d="M1 3.5h2L6 1v8L3 6.5H1z" /><path class="on" d="M7 3q1.5 2 0 4M8.3 1.8q2.6 3.2 0 6.4" fill="none" stroke="currentColor" /><path class="off" d="m7 3.5 2.5 3m0-3L7 6.5" fill="none" stroke="currentColor" /></svg>
            </button>
          </div>
          <button id="jump" class="key jump" type="button">JUMP</button>
        </div>
      </div>
    </main>
    <script src="/loader.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
